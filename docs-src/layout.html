<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0f0f0f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Cpath d='M7 9l9 15 9-15' fill='none' stroke='%23ffe343' stroke-width='4' stroke-linejoin='round'/%3E%3Crect x='22' y='6' width='4' height='4' fill='%232748c9'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/docs.css?v={{assetVersion}}">
  <script src="assets/docs.js?v={{assetVersion}}" defer></script>
</head>
<body data-page="{{slug}}" data-group="{{group}}">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <button class="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false">
        <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Menu</span>
      </button>
      <a class="brand" href="index.html" aria-label="vedaloiv documentation home">
        <span class="brand-name">vedaloiv</span><span class="brand-sub">docs</span>
      </a>
      <nav class="topnav" aria-label="Site">
        <a href="{{landing}}">Home</a>
        <a href="index.html">All docs</a>
      </nav>
      <div class="topbar-actions">
        <button class="search-btn" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K /">
          <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="search-btn-label">Search docs</span>
          <kbd class="search-btn-kbd" data-shortcut>Ctrl K</kbd>
        </button>
        {{storeLink}}
      </div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Documentation">
      <nav class="sidebar-nav" aria-label="Documentation pages">
{{sidebar}}
      </nav>
    </aside>
    <div class="scrim" data-close-nav hidden></div>

    <main class="main" id="content" tabindex="-1">
      <article class="doc">
        {{breadcrumb}}
        {{pageHeader}}
        <div class="prose">
{{content}}
        </div>
        {{pager}}
      </article>
    </main>

    <aside class="toc" aria-labelledby="toc-title">
      {{toc}}
    </aside>
  </div>

  {{footer}}

  <dialog class="search-dialog" aria-label="Search the documentation">
    <form class="search-form" role="search" method="dialog">
      <svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg>
      <input class="search-input" type="search" placeholder="Search pages and sections" autocomplete="off" spellcheck="false"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" aria-label="Search the documentation">
      <button class="search-close" type="button" data-close-search><kbd>Esc</kbd><span class="sr-only">Close search</span></button>
    </form>
    <ul class="search-results" id="search-results" role="listbox" aria-label="Results"></ul>
    <p class="search-status" aria-live="polite"></p>
  </dialog>

  <dialog class="lightbox" aria-label="Image viewer">
    <button class="lightbox-close" type="button" data-close-lightbox>Close <kbd>Esc</kbd></button>
    <img alt="">
    <p class="lightbox-caption"></p>
  </dialog>
</body>
</html>
