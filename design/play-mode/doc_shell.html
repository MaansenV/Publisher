<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Rubik:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0B0D}
a{color:#F2F1EC}a:hover{color:#F4E04D}
:focus-visible{outline:3px solid #F4E04D;outline-offset:3px}
.menu-btn{display:none}
@media (max-width: 1100px){.toc{display:none}}
@media (max-width: 860px){.sidebar{display:none !important}.menu-btn{display:inline-flex !important}.hide-sm{display:none !important}main{padding:24px 16px 72px !important}}
.nav a{transition:background .15s,color .15s}
.nav a:hover{background:#16181C;color:#F2F1EC}
.nav a.on:hover{background:%%AC_DIM%%}
.btn{transition:transform .18s ease,box-shadow .18s ease}
.btn:hover{transform:translate(-3px,-3px);box-shadow:4px 4px 0 #F2F1EC}
.pn,.prose .card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.pn:hover,.prose .card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 %%AC%%;border-color:%%AC%%;color:#F2F1EC}
.line{display:block;overflow:hidden;padding-bottom:0.04em}
.rise{display:block;animation:rise .9s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.read{position:absolute;left:0;bottom:-1px;height:3px;width:100%;background:%%AC%%;transform-origin:left;transform:scaleX(.2)}
@supports (animation-timeline: scroll()){.read{transform:scaleX(0);animation:grow linear both;animation-timeline:scroll(root)}}
@keyframes grow{to{transform:scaleX(1)}}
.prose{display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.7;color:#C9CCD1}
.prose>*{margin:0}
.prose h2{margin-top:22px;font-size:26px;font-weight:700;line-height:1.25;color:#F2F1EC;scroll-margin-top:90px}
.prose h3{margin:6px 0 0;font-size:19px;font-weight:700;line-height:1.3;color:#F2F1EC;scroll-margin-top:90px}
.prose p{margin:0}
.prose p.lead{font-size:19px;color:#D9DBDF}
.prose strong{color:#F2F1EC;font-weight:600}
.prose a{color:%%AC_LIGHT%%}
.prose a:hover{color:#F4E04D}
.prose code{font-family:'JetBrains Mono',monospace;font-size:.84em;background:#1A1D22;color:#F4E04D;padding:1px 6px}
.prose pre{margin:0;background:#050607;border:1px solid #2E3137;padding:14px 18px;overflow-x:auto;font-size:14px;line-height:1.6}
.prose pre code{background:none;padding:0;color:#E5E6E2;font-size:14px}
.prose :not(pre)>code{overflow-wrap:anywhere}
.prose td,.prose dd,.prose li,.prose p,.prose h2,.prose h3,.prose summary{overflow-wrap:anywhere}
.prose kbd{font-family:'JetBrains Mono',monospace;font-size:.8em;border:1px solid #3A3E46;border-bottom-width:2px;padding:0 6px;color:#F2F1EC;background:#121418}
.prose .menu{font-weight:600;color:#F2F1EC}
.prose ul,.prose ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.prose li>ul,.prose li>ol{margin-top:6px}
.prose ol.steps{list-style:none;padding:0;gap:0;border:1px solid #2E3137;counter-reset:s}
.prose ol.steps>li{counter-increment:s;position:relative;padding:14px 18px 14px 62px;border-bottom:1px solid #24272D}
.prose ol.steps>li:last-child{border-bottom:0}
.prose ol.steps>li::before{content:counter(s,decimal-leading-zero);position:absolute;left:20px;top:16px;font-family:'JetBrains Mono',monospace;font-size:13px;color:%%AC_LIGHT%%}
.prose dl{margin:0}
.prose dl.props{border-top:1px solid #2E3137}
.prose dl.props dt{padding-top:14px;color:#F2F1EC;line-height:1.9}
.prose dt .type,.prose dt .default{margin-left:6px}
.prose dl.props dd{margin:4px 0 0;padding-bottom:14px;border-bottom:1px solid #24272D;font-size:15px;line-height:1.6}
.prose dt code{font-size:14px;font-weight:600;background:none;color:#F2F1EC;padding:0}
.prose .type{font-family:'JetBrains Mono',monospace;font-size:12px;color:#4FF0D2}
.prose .default{font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #3A3E46;color:#9BA0A8;padding:0 6px}
.prose .callout{padding:14px 18px;color:#E5E6E2;display:flex;flex-direction:column;gap:6px}
.prose .callout>*{margin:0}
.prose .callout-title{display:block;font-weight:700}
.prose .callout.warn{background:#F4E04D;color:#0A0B0D}
.prose .callout.warn strong,.prose .callout.warn a{color:#0A0B0D}
.prose .callout.warn a{font-weight:700}
.prose .callout.warn code{background:#0A0B0D;color:#F4E04D}
.prose .callout.note{border:1px solid %%AC%%;background:%%AC_SOFT%%}
.prose .callout.note .callout-title{color:%%AC_LIGHT%%}
.prose .callout.tip{border:1px solid #3DDC97;background:#0D2219}
.prose .callout.tip .callout-title{color:#3DDC97}
.prose .badge{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:%%AC%%;color:%%AC_ON%%;padding:1px 7px;vertical-align:middle}
.prose .badge.breaking{background:#FF4F7B;color:#0A0B0D}
.prose .tbl{border:1px solid #2E3137;overflow-x:auto}
.prose table{width:100%;border-collapse:collapse;font-size:15px;line-height:1.55}
.prose th{background:#121418;text-align:left;vertical-align:bottom;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#9BA0A8;padding:10px 14px;border-bottom:1px solid #3A3E46}
.prose td{padding:10px 14px;border-bottom:1px solid #24272D;vertical-align:top}
.prose tbody tr:last-child td{border-bottom:0}
.prose tbody tr{transition:background .15s}
.prose tbody tr:hover{background:#121418}
.prose figure{margin:0;border:1px solid #2E3137;background:#050607}
.prose figure img{display:block;max-width:100%;height:auto;margin:0 auto}
.prose figcaption{padding:10px 14px;border-top:1px solid #2E3137;font-size:14px;color:#9BA0A8}
.prose .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.prose .card{border:1px solid #2E3137;background:#121418;padding:14px 16px;text-decoration:none;display:flex;flex-direction:column;gap:2px;color:#F2F1EC}
.prose .card span{font-size:14px;color:#B9BDC4;line-height:1.5}
.prose details{border-top:1px solid #2E3137;border-bottom:1px solid #2E3137}
.prose summary{cursor:pointer;padding:14px 4px;font-weight:600;color:#F2F1EC}
.prose summary:hover{color:#F4E04D}
.prose .vid{position:relative;display:block;aspect-ratio:16/9;border:1px solid #2E3137;background:#050607;overflow:hidden}
.prose .vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.prose .vid-play{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;background:#F4E04D;display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 #000;transition:transform .18s}
.prose .vid:hover .vid-play{transform:scale(1.08)}
.prose .key{border:1px solid #2E3137}
.prose .key img{width:100%;aspect-ratio:16/9;object-fit:cover;object-position:left center}
.prose .vid-note{position:absolute;left:12px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#F2F1EC;background:rgba(5,6,7,.8);padding:2px 8px}
.prose.changelog{gap:0}
.prose.changelog>*:not(section){margin-bottom:18px}
.prose .rel{position:relative;margin-left:7px;padding:0 0 36px 34px;border-left:2px solid #2E3137;display:flex;flex-direction:column;gap:14px}
.prose .rel>*{margin:0}
.prose .rel h2{margin:0;font-family:'Anton','Impact',sans-serif;font-weight:400;font-size:38px;line-height:1;position:relative}
.prose .rel h2::before{content:"";position:absolute;left:-42px;top:10px;width:14px;height:14px;box-sizing:border-box;border:2px solid %%AC%%;background:#0A0B0D}
.prose .rel-latest h2::before{background:%%AC%%;animation:pulse 2s ease-out infinite}
.prose .rel h2 .badge{font-family:'JetBrains Mono',monospace;font-size:12px;margin-left:10px;position:relative;top:-6px}
.prose .rel>p:first-of-type{font-family:'JetBrains Mono',monospace;font-size:13px;color:#9BA0A8;margin-top:-6px}
.prose h3.chg{align-self:flex-start;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid;padding:0 8px;line-height:1.7;margin-top:6px}
.prose h3.chg-added{color:#3DDC97}.prose h3.chg-changed{color:%%AC_LIGHT%%}.prose h3.chg-fixed{color:#4FF0D2}.prose h3.chg-removed{color:#FF7A9A}
@keyframes pulse{0%{box-shadow:0 0 0 0 %%AC%%aa}100%{box-shadow:0 0 0 10px %%AC%%00}}
.prose .lvl{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:1px 7px;white-space:nowrap}
.prose .lvl-error{background:#FF4F7B;color:#0A0B0D}
.prose .lvl-warning{border:1px solid #F4E04D;color:#F4E04D}
.prose .lvl-info{border:1px solid #8DA2FF;color:#8DA2FF}
.prose .lvl-filter{display:flex;flex-wrap:wrap;gap:8px}
.prose .lvl-filter input{position:absolute;opacity:0;width:1px;height:1px}
.prose .lvl-filter label{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;font-size:14px;font-weight:600;border:1px solid #3A3E46;cursor:pointer;color:#F2F1EC}
.prose .lvl-filter label:hover{border-color:#F2F1EC}
.prose .lvl-filter input:checked+label{background:#F4E04D;border-color:#F4E04D;color:#0A0B0D}
.prose .lvl-filter input:focus-visible+label{outline:3px solid #F4E04D;outline-offset:3px}
.prose:has(#lvl-error:checked) tr[data-level]:not([data-level="error"]),.prose:has(#lvl-warning:checked) tr[data-level]:not([data-level="warning"]),.prose:has(#lvl-info:checked) tr[data-level]:not([data-level="info"]){display:none}
.still *{animation:none !important}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
