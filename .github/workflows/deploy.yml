name: Deploy Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static publish of the Open Design site (od-site/). No build step.
      # index.html = copy of the entry page so the site root (/Publisher/)
      # serves the landing page directly; docs/ back-links keep resolving
      # against unity-asset-portfolio.html, which is published as well.
      # design.md (OD design source doc) stays in the repo but is not published.
      - name: Prepare publish dir
        run: |
          mkdir -p _site
          cp -r od-site/. _site/
          rm _site/design.md
          cp od-site/unity-asset-portfolio.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment